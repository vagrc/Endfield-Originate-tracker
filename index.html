<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 月間統計 ===== */

.monthly-stats {
    flex: 0 0 auto;
    margin-top: 12px;
}

.monthly-stats-title {
    font-size: 13px;
    color: rgba(255,255,255,.45);
    margin-bottom: 7px;
}

.monthly-stats-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 8px;
    scroll-behavior: smooth;
}

.monthly-stats-scroll::-webkit-scrollbar {
    height: 5px;
}

.monthly-stats-scroll::-webkit-scrollbar-track {
    background: rgba(255,255,255,.03);
}

.monthly-stats-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.18);
    border-radius: 10px;
}

.monthly-stat-card {
    flex: 0 0 150px;
    min-height: 58px;
    padding: 8px 12px;

    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    transition: .2s ease;
}

.monthly-stat-card:hover {
    border-color: rgba(255,70,80,.35);
    background: rgba(255,255,255,.055);
}

.monthly-stat-period {
    font-size: 11px;
    color: rgba(255,255,255,.48);
    margin-bottom: 3px;
    white-space: nowrap;
}

.monthly-stat-value {
    font-family: 'Oswald', sans-serif;

    white-space: nowrap;
}

.monthly-stat-value.positive {
    color: #ff4652;
}

.monthly-stat-value.negative {
    color: #62c8ff;
}

}

.monthly-stats-empty {
    color: rgba(255,255,255,.25);
    font-size: 11px;
    padding: 10px 0;
}
* { box-sizing: border-box; }

body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    background-image: url('https://pbs.twimg.com/media/HBCauHeawAADZ4U.jpg');

    background-position: center;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}
body::before {

    inset: 0;
    background: rgba(0, 0, 0, 0.4);

}
.container {
    position: relative;
    z-index: 2;

    -webkit-backdrop-filter: blur(4px);

    box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 80px rgba(0,0,0,.6);

    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
}
.circle-container {
    position: relative;
    width: 240px;
    height: 240px;

}
svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.circle-bg {
    fill: none;
    stroke: rgba(255,255,255,.08);
    stroke-width: 8;
    transition: stroke .4s ease, filter .4s ease;
}
.circle-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: butt;
    stroke-dasharray: 628.318;
    stroke-dashoffset: 628.318;
    transition: stroke-dashoffset 1.2s cubic-bezier(.19,1,.22,1), stroke .4s ease, filter .4s ease, opacity .3s ease;
}
.center-text {
    position: absolute;
    top: 52%;
    left: 50%;

    text-align: center;

}
.current-percent {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1;
    transition: color .4s ease, filter .4s ease;
}
.label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,.4);
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-top: 8px;
}
.stats {
    display: flex;

    align-items: center;

    border: 1px solid rgba(255,255,255,.12);

}
.stats:hover {

#numInput {

.stats-value {

/* 統計画面 */

<body>

<div class="container">

<div class="history-overlay" id="historyOverlay">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
    getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const GOAL = 660000;
const CIRCUMFERENCE = 2 * Math.PI * 100;

const firebaseConfig = {
    apiKey: "AIzaSyAVh5-phw8hBmgqNpchlUbOmvPjF-B1F7M",
    authDomain: "arknights-endfield-tracker.firebaseapp.com",
    projectId: "arknights-endfield-tracker",
    storageBucket: "arknights-endfield-tracker.firebasestorage.app",
    messagingSenderId: "1098323392414",
    appId: "1:1098323392414:web:c804d5beb53a3280b1888f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const mainRef = doc(db, "tracker", "main");
const historyCollection = collection(db, "history");

let isLoading = false; 
let lastValue = 0;
let savedValue = 0;

function getLocalDateKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function formatDate(key) {
    const [y, m, d] = key.split("-");
    return `${y}/${m}/${d}`;
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString("ja-JP");
}

async function saveValue(value) {
    await setDoc(mainRef, { value: value });
}

/* その日の最初のアクセス時だけ履歴を作る */
async function saveDailyHistory(value) {
    const key = getLocalDateKey();
    const ref = doc(db, "history", key);

    await setDoc(ref, {
        value: Number(value),
        date: key,
        updatedAt: new Date().toISOString()
    }, { merge: true });
}
function updateProgress(valueOverride = null, shouldSave = true) {
    const input = document.getElementById("numInput");

    let value;
    if (valueOverride !== null) {
        value = Number(valueOverride) || 0;
    } else {
        let expression = input.value.replace(/,/g, "").trim();
        value = expression
            .split(/[\s+]+/)
            .reduce((sum, n) => sum + (parseInt(n) || 0), 0);
    }

    value = Math.max(0, value);
    lastValue = value;

    const ratio = value / GOAL;
    const remaining = GOAL - value;

    let percentStr;
    if (value < GOAL) {
        percentStr = (Math.floor((value / GOAL) * 1000) / 10).toFixed(1);
    } else {
        percentStr = (ratio * 100).toFixed(1);
    }

    let visualRatio = ratio % 1;
    if (ratio > 0 && visualRatio === 0) visualRatio = 1;

    let offset = CIRCUMFERENCE - (visualRatio * CIRCUMFERENCE);
    if (percentStr === "99.9") offset = 1;

    const circleBg = document.getElementById("circleBg");
    let hue;

    if (ratio <= 1) {
        circleBg.style.stroke = "rgba(255,255,255,.08)";
        circleBg.style.filter = "none";
        hue = 360 - (ratio * 165);
    } else {
        circleBg.style.stroke = "rgba(0,195,255,.25)";
        circleBg.style.filter = "drop-shadow(0 0 6px rgba(0,195,255,.3))";
        const overflowRatio = Math.min(ratio - 1, 1);
        hue = 145 - (overflowRatio * 80);
    }

    const currentHSL = `hsl(${hue}, 100%, 55%)`;
    const progressCircle = document.getElementById("progressCircle");
    const percentText = document.getElementById("percentText");
    const remainingCenter = document.getElementById("remainingCenter");

    progressCircle.style.opacity = value === 0 ? "0" : "1";
    progressCircle.style.strokeDashoffset = offset;
    progressCircle.style.stroke = currentHSL;
    progressCircle.style.filter = `drop-shadow(0 0 15px ${currentHSL})`;

    percentText.innerText = percentStr + "%";
    percentText.style.color = currentHSL;
    percentText.style.filter = `drop-shadow(0 0 10px ${currentHSL})`;

    input.value = value.toLocaleString();
    input.style.color = currentHSL;
    input.style.textShadow = `0 0 10px ${currentHSL}`;

    if (remaining <= 0) {
        remainingCenter.innerText = "完凸可能";
        remainingCenter.style.color = currentHSL;
        remainingCenter.style.textShadow = `0 0 15px ${currentHSL}`;
    } else {
        remainingCenter.innerText = remaining.toLocaleString();
        remainingCenter.style.color = currentHSL;
        remainingCenter.style.textShadow = `0 0 10px ${currentHSL}`;
    }

    
}

async function loadValue() {
    isLoading = true;

    try {
        const snap = await getDoc(mainRef);

        if (snap.exists()) { 
    savedValue = Number(snap.data().value) || 0;
    lastValue = savedValue;
    updateProgress(savedValue, false); 
} else { 
    savedValue = 0;
    lastValue = 0;
    updateProgress(0, false); 
}


    } catch (error) {
        console.error("Firebase読み込みエラー:", error);
        updateProgress(0, false);
    } finally {
        isLoading = false;
    }
}

async function loadHistory() {
    const snapshot = await getDocs(historyCollection);

    const records = [];
    snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.date && Number.isFinite(Number(data.value))) {
            records.push({
                id: docSnap.id,
                date: data.date,
                value: Number(data.value)
            });
        }
    });

    records.sort((a, b) => a.date.localeCompare(b.date));
    return records;
}

/* 長期間の記録を画面上だけ適度にまとめる */
function aggregateRecords(records) {
    if (records.length <= 31) return records;

    const now = new Date();
    const cutoffRecent = new Date(now);
    cutoffRecent.setDate(cutoffRecent.getDate() - 31);

    const recent = [];
    const old = [];

    for (const r of records) {
        const [y,m,d] = r.date.split("-").map(Number);
        const date = new Date(y, m - 1, d);
        if (date >= cutoffRecent) recent.push(r);
        else old.push(r);
    }

    if (old.length === 0) return recent;

    const groups = new Map();

    for (const r of old) {
        const [y,m,d] = r.date.split("-").map(Number);
        const date = new Date(y, m - 1, d);

        let key;
        if (records.length <= 120) {
            const day = date.getDay();
            const monday = new Date(date);
            const diff = (day + 6) % 7;
            monday.setDate(date.getDate() - diff);
            key = getLocalDateKey(monday);
        } else {
            key = `${y}-${String(m).padStart(2,"0")}-01`;
        }

        groups.set(key, r);
    }

    return [...groups.values(), ...recent].sort((a,b) => a.date.localeCompare(b.date));
}

function niceStep(range) {
    const raw = range / 5;
    const power = Math.pow(10, Math.floor(Math.log10(raw)));
    const normalized = raw / power;

    let nice;
    if (normalized <= 1) nice = 1;
    else if (normalized <= 2) nice = 2;
    else if (normalized <= 5) nice = 5;
    else nice = 10;

    return nice * power;
}

function drawChart(records) {
    const canvas = document.getElementById("historyChart");
    const tooltip = document.getElementById("chartTooltip");
const tooltipDate = document.getElementById("chartTooltipDate");
const tooltipValue = document.getElementById("chartTooltipValue");
    const empty = document.getElementById("chartEmpty");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));

    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = rect.height;

    ctx.clearRect(0, 0, w, h);

    if (!records.length) {
        empty.style.display = "flex";
        return;
    }

    empty.style.display = "none";

    const pad = { left: 68, right: 55, top: 20, bottom: 42 };
    const chartW = Math.max(1, w - pad.left - pad.right);
    const chartH = Math.max(1, h - pad.top - pad.bottom);

    const values = records.map(r => r.value);
    const minValue = Math.min(...values);
    const maxValue = Math.max(...values);

    let range = Math.max(1, maxValue - minValue);
    const step = niceStep(range);
    const axisMin = Math.max(0, Math.floor(minValue / step) * step);
    let axisMax = Math.ceil(maxValue / step) * step;

    if (axisMax <= axisMin) axisMax = axisMin + step;
    const axisRange = axisMax - axisMin;

    ctx.font = "11px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    for (let v = axisMin; v <= axisMax + step * .001; v += step) {
        const y = pad.top + chartH - ((v - axisMin) / axisRange) * chartH;

        ctx.strokeStyle = "rgba(255,255,255,.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();

        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.fillText(formatNumber(Math.round(v)), pad.left - 9, y);
    }

    const xFor = i => records.length === 1
        ? pad.left + chartW / 2
        : pad.left + (i / (records.length - 1)) * chartW;

    const yFor = value =>
        pad.top + chartH - ((value - axisMin) / axisRange) * chartH;

    /* 線 */
    ctx.beginPath();
    records.forEach((r,i) => {
        const x = xFor(i), y = yFor(r.value);
        if (i === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = "rgba(255,70,80,.95)";
    ctx.lineWidth = 2.2;
    ctx.shadowColor = "rgba(255,40,50,.35)";
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* 点 */
    records.forEach((r,i) => {
        const x = xFor(i), y = yFor(r.value);

        ctx.beginPath();
        ctx.arc(x,y,3.5,0,Math.PI*2);
        ctx.fillStyle = "#ff4652";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x,y,6,0,Math.PI*2);
        ctx.strokeStyle = "rgba(255,70,80,.22)";
        ctx.stroke();
    });

    /* 横軸の日付。多すぎる場合は間引く */
    const maxLabels = Math.max(2, Math.floor(chartW / 75));
    const labelStep = Math.max(1, Math.ceil(records.length / maxLabels));

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(255,255,255,.42)";
    ctx.font = "10px Arial";

    records.forEach((r,i) => {
        if (i !== records.length - 1 && i % labelStep !== 0) return;

        const x = xFor(i);
        ctx.fillText(formatDate(r.date), x, pad.top + chartH + 12);
    });
}

function renderHistoryList(records) {
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    const displayRecords = records.slice(-9).reverse();

    for (const r of displayRecords) {

        del.className = "history-delete";
        del.title = "この記録を削除";
        del.textContent = "🗑";
        del.addEventListener("click", async () => {

            try {
                await deleteDoc(doc(db, "history", r.id));
                await refreshHistory();
            } catch (error) {
                console.error(error);
                alert("削除できませんでした。");

        });

}
function renderMonthlyStats(records) {
    const container = document.getElementById("monthlyStats");
    container.innerHTML = "";

    if (records.length === 0) {
        const empty = document.createElement("div");
        empty.className = "monthly-stats-empty";
        empty.textContent = "記録がありません";
        container.appendChild(empty);
        return;
    }

    // 月ごとに記録をまとめる
    const monthly = new Map();

    for (const r of records) {
        const [y, m] = r.date.split("-").map(Number);
        const key = `${y}-${String(m).padStart(2, "0")}`;

        if (!monthly.has(key)) {
            monthly.set(key, []);
        }

        monthly.get(key).push(r);
    }

    const months = [...monthly.entries()]
        .sort((a, b) => a[0].localeCompare(b[0]));

    for (const [monthKey, monthRecords] of months) {
        const first = monthRecords[0];
        const last = monthRecords[monthRecords.length - 1];

        const change = last.value - first.value;

        const [year, month] = monthKey.split("-").map(Number);

        const card = document.createElement("div");
        card.className = "monthly-stat-card";

        const period = document.createElement("div");
        period.className = "monthly-stat-period";

        // その月の最初と最後の日付
        const firstDay = Number(first.date.split("-")[2]);
        const lastDay = Number(last.date.split("-")[2]);

        if (firstDay === lastDay) {
            period.textContent = `${month}月 ${lastDay}日`;
        } else {
            period.textContent = `${month}月 ${firstDay}日～${lastDay}日`;
        }

        const value = document.createElement("div");
        value.className = "monthly-stat-value";

        if (change > 0) {
            value.classList.add("positive");
            value.textContent = `＋${formatNumber(change)}`;
        } else if (change < 0) {
            value.classList.add("negative");
            value.textContent = `−${formatNumber(Math.abs(change))}`;
        } else {
            value.classList.add("zero");
            value.textContent = "±0";
        }

        card.append(period, value);
        container.appendChild(card);
    }

    // 最新の月を右端に表示
    container.scrollLeft = container.scrollWidth;
}

async function refreshHistory() {
    const records = await loadHistory();
    const displayRecords = aggregateRecords(records);

    document.getElementById("historyCurrentValue").textContent =
        formatNumber(lastValue);

    renderMonthlyStats(records);

    requestAnimationFrame(() => drawChart(displayRecords));
}

async function openHistory() {
    try {
        const snap = await getDoc(mainRef);

        if (snap.exists()) {
            const saved = Number(snap.data().value) || 0;

            savedValue = saved;
            lastValue = saved;

            updateProgress(saved, false);
        }

        document.getElementById("historyOverlay").classList.add("open");
        await refreshHistory();

    } catch (error) {
        console.error("履歴読み込みエラー:", error);
    }
}

function closeHistory() {
    document.getElementById("historyOverlay").classList.remove("open");
}

const numInput = document.getElementById("numInput");

function normalizeInput(value) {
    value = value.replace(/[０-９]/g, c =>
        String.fromCharCode(c.charCodeAt(0) - 0xFEE0)
    );

    value = value.replace(/[^\d,]/g, "");

    return value;
}

numInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();

        const command = this.value.trim().toLowerCase();

        if (command === "log" || command === "history") {
    openHistory();
    return;
}

        this.value = normalizeInput(this.value);
        updateProgress();
        this.blur();
    }
});

numInput.addEventListener("blur", function() {
    const value = this.value.trim();

    if (value === "") {
        this.value = lastValue.toLocaleString();
        return;
    }

    if (!/^[0-9０-９,]+$/.test(value)) {
        this.value = lastValue.toLocaleString();
        return;
    }

    this.value = normalizeInput(value);
});

numInput.addEventListener("compositionend", function() {
    this.value = normalizeInput(this.value);
});

});

// ===== 保存済み履歴画面 =====

async function openHistoryManager() {
    const manager = document.getElementById("historyManager");
    const list = document.getElementById("historyManagerList");

    manager.classList.add("open");
    list.innerHTML = "";

    try {
        const records = await loadHistory();

        if (!records.length) {
            const empty = document.createElement("div");
            empty.className = "history-manager-empty";
            empty.textContent = "保存済み履歴はありません";
            list.appendChild(empty);
            return;
        }

        // 新しい日付から順番に表示
        records.reverse();

        for (const r of records) {
            const row = document.createElement("div");
            row.className = "history-manager-row";

            const date = document.createElement("span");
            date.className = "history-manager-date";
            date.textContent = formatDate(r.date);

            const value = document.createElement("span");
            value.className = "history-manager-value";
            value.textContent = formatNumber(r.value);

            const del = document.createElement("button");
            del.className = "history-manager-delete";
            del.textContent = "🗑";
            del.title = "この履歴を削除";

            del.addEventListener("click", async () => {
                if (!confirm(`${formatDate(r.date)} の履歴を削除しますか？`)) {
                    return;
                }

                try {
                    await deleteDoc(doc(db, "history", r.id));
                    await openHistoryManager();
                    await refreshHistory();
                } catch (error) {
                    console.error("履歴削除エラー:", error);
                    alert("履歴を削除できませんでした。");
                }
            });

            row.append(date, value, del);
            list.appendChild(row);
        }

    } catch (error) {
        console.error("履歴一覧読み込みエラー:", error);
        list.innerHTML = "";

        const empty = document.createElement("div");
        empty.className = "history-manager-empty";
        empty.textContent = "履歴を読み込めませんでした";
        list.appendChild(empty);
    }
}

function closeHistoryManager() {
    document.getElementById("historyManager").classList.remove("open");
}
